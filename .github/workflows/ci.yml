name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Lint and test on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor declared in the plugin header; 8.3 is what current
        # hosts actually run. Both are checked so the declared floor stays true.
        php: ['7.4', '8.3']

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run the smoke tests
        run: php tests/smoke-test.php

  package:
    name: Release package
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the package the way a release would
        run: |
          set -euo pipefail

          git archive --format=zip --prefix=wplinker/ -o wplinker.zip HEAD

          # The archive must unpack straight into wp-content/plugins/wplinker.
          if ! unzip -l wplinker.zip | grep -q 'wplinker/wplinker.php'; then
            echo "::error::wplinker.zip does not contain wplinker/wplinker.php"
            exit 1
          fi

          # The export-ignore list in .gitattributes rots silently when a new
          # directory is added; catch that here rather than at tag time.
          if unzip -l wplinker.zip | grep -qE 'wplinker/(tests|\.github)/'; then
            echo "::error::wplinker.zip contains development files"
            exit 1
          fi

          unzip -l wplinker.zip
